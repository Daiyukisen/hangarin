{% extends "base.html" %}

{% block content %}
<div class="card col-md-6 mx-auto mt-5">
    <div class="card-header">
        <h3 class="card-title">{% if form.instance.pk %}Modify Subtask{% else %}New Subtask{% endif %}</h3>
    </div>
    <form method="post">
        {% csrf_token %}
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label required">Subtask Title</label>
                {{ form.title }}
            </div>
            <div class="mb-3">
                <label class="form-label required">Current Status</label>
                {{ form.status }}
            </div>
        </div>
        <div class="card-footer text-end">
            <button type="submit" class="btn btn-primary">Save Subtask</button>
        </div>
    </form>
</div>
{% endblock %}
