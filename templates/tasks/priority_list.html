{% extends "base.html" %}

{% block content %}
<div class="page-header d-flex justify-content-between align-items-center">
    <h2 class="page-title">Manage Priorities</h2>
    <a href="{% url 'priority_create' %}" class="btn btn-primary">+ Create Priority</a>
</div>

<div class="card mt-3 col-md-8 mx-auto">
    <table class="table card-table table-vcenter">
        <thead><tr><th>Priority Level</th><th class="w-1">Actions</th></tr></thead>
        <tbody>
            {% for pr in priorities %}
            <tr>
                <td><span class="badge bg-red-lt">{{ pr.name }}</span></td>
                <td>
                    <div class="btn-list flex-nowrap">
                        <a href="{% url 'priority_update' pr.id %}" class="btn btn-sm btn-white">Rename</a>
                    </div>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="2" class="text-center">No priority configurations found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
