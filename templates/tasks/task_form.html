{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h2 class="page-title">{% if form.instance.pk %}Edit Task{% else %}Create New Task{% endif %}</h2>
</div>

<div class="row row-cards mt-2">
    <div class="col-12">
        <form method="post" class="card">
            {% csrf_token %}
            <div class="card-body">
                <div class="row row-cards">
                    <div class="col-md-12">
                        <div class="mb-3">
                            <label class="form-label required">Task Title</label>
                            {{ form.title }}
                        </div>
                    </div>
                    <div class="col-md-12">
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            {{ form.description }}
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-4">
                        <div class="mb-3">
                            <label class="form-label required">Category</label>
                            {{ form.category }}
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-4">
                        <div class="mb-3">
                            <label class="form-label required">Priority</label>
                            {{ form.priority }}
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-4">
                        <div class="mb-3">
                            <label class="form-label required">Status</label>
                            {{ form.status }}
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-4">
                        <div class="mb-3">
                            <label class="form-label required">Deadline</label>
                            {{ form.deadline }}
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-footer text-end">
                <a href="{% url 'task_list' %}" class="btn btn-link">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Task</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
