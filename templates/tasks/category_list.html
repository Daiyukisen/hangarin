{% extends "base.html" %}

{% block content %}
<div class="page-header d-flex justify-content-between align-items-center">
    <h2 class="page-title">Manage Categories</h2>
    <a href="{% url 'category_create' %}" class="btn btn-primary">+ Create Category</a>
</div>

<div class="card mt-3 col-md-8 mx-auto">
    <table class="table card-table table-vcenter">
        <thead><tr><th>Category Name</th><th class="w-1">Actions</th></tr></thead>
        <tbody>
            {% for cat in categories %}
            <tr>
                <td><strong>{{ cat.name }}</strong></td>
                <td>
                    <div class="btn-list flex-nowrap">
                        <a href="{% url 'category_update' cat.id %}" class="btn btn-sm btn-white">Rename</a>
                    </div>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="2" class="text-center">No categories configured.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
