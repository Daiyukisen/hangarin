{% extends "base.html" %}

{% block content %}
<div class="card col-md-6 mx-auto mt-5">
    <div class="card-header">
        <h3 class="card-title">{% if form.instance.pk %}Edit Note{% else %}Add Note to Task{% endif %}</h3>
    </div>
    <form method="post">
        {% csrf_token %}
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label required">Content / Observations</label>
                {{ form.content }}
            </div>
        </div>
        <div class="card-footer text-end">
            <button type="submit" class="btn btn-primary">Save Note</button>
        </div>
    </form>
</div>
{% endblock %}
