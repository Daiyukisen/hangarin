{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Complete Sign Up | Hangarin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-wrapper {
      display: flex;
      width: 900px;
      min-height: 540px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }
    .auth-left {
      flex: 1;
      background: linear-gradient(135deg, #0f172a 0%, #1e40af 50%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 36px;
      position: relative;
      overflow: hidden;
    }
    .auth-left::before {
      content: '';
      position: absolute;
      top: -80px; right: -80px;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(59,130,246,0.35) 0%, transparent 70%);
      border-radius: 50%;
    }
    .auth-left::after {
      content: '';
      position: absolute;
      bottom: -60px; left: -60px;
      width: 250px; height: 250px;
      background: radial-gradient(circle, rgba(147,197,253,0.25) 0%, transparent 70%);
      border-radius: 50%;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-size: 1.3rem;
      font-weight: 700;
      z-index: 1;
    }
    .auth-left-bottom { z-index: 1; }
    .auth-left-bottom h2 {
      color: #fff;
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 12px;
    }
    .auth-left-bottom p {
      color: rgba(255,255,255,0.6);
      font-size: 0.875rem;
      line-height: 1.6;
    }
    .dots { display: flex; gap: 6px; margin-top: 20px; }
    .dot { width: 24px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3); }
    .dot.active { background: #fff; width: 32px; }
    .auth-right {
      flex: 1;
      background: #1e293b;
      padding: 48px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .auth-right h1 {
      color: #fff;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .auth-right .subtitle {
      color: rgba(255,255,255,0.45);
      font-size: 0.875rem;
      margin-bottom: 28px;
    }
    .auth-right .subtitle a {
      color: #93c5fd;
      text-decoration: none;
      font-weight: 600;
    }
    .form-label {
      color: rgba(255,255,255,0.6);
      font-size: 0.78rem;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .form-control {
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 10px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      padding: 11px 14px;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      background: #0f172a;
      border-color: #1d4ed8;
      box-shadow: 0 0 0 3px rgba(29,78,216,0.15);
      color: #fff;
    }
    .form-control::placeholder { color: rgba(255,255,255,0.25); }
    .btn-main {
      background: #1d4ed8;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 12px;
      width: 100%;
      transition: background 0.2s;
      margin-top: 4px;
    }
    .btn-main:hover { background: #1e3a8a; color: #fff; }
    .text-danger { font-size: 0.8rem; margin-top: 4px; }
    @media (max-width: 768px) {
      .auth-wrapper { flex-direction: column; width: 100%; min-height: 100vh; border-radius: 0; }
      .auth-left { min-height: 200px; padding: 24px; }
      .auth-right { padding: 32px 24px; }
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-right">
      <h1>Complete Sign Up</h1>
      <p class="subtitle">
        Signing in with your social account.<br>
        <a href="{% url 'account_login' %}">Use a different account?</a>
      </p>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            <input
              type="{{ field.field.widget.input_type }}"
              name="{{ field.html_name }}"
              class="form-control"
              placeholder="{{ field.label }}"
              value="{{ field.value|default:'' }}"
            />
            {% if field.errors %}
              <div class="text-danger">{{ field.errors|join:", " }}</div>
            {% endif %}
          </div>
        {% endfor %}
        <button type="submit" class="btn-main mt-2">Complete Sign Up</button>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
